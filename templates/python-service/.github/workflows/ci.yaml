# Golden-path CI: test -> build & push image -> bump tag in Git (Argo CD deploys it).
# Copy to the repo root .github/workflows/ (one workflow per service, filtered by path).
name: __SERVICE_NAME__-ci
on:
  push:
    branches: [main]
    paths: ["services/__SERVICE_NAME__/**"]
  pull_request:
    paths: ["services/__SERVICE_NAME__/**"]

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: services/__SERVICE_NAME__

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt
      - run: cd app && pytest -q
      - name: Lint Helm chart
        run: helm lint chart

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: v
        run: echo "tag=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/__SERVICE_NAME__
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/__SERVICE_NAME__:${{ steps.v.outputs.tag }}
      - name: Bump image tag (GitOps)
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ steps.v.outputs.tag }}\"/" chart/values.yaml
          git config user.name "platform-bot"
          git config user.email "platform-bot@users.noreply.github.com"
          git commit -am "deploy(__SERVICE_NAME__): ${{ steps.v.outputs.tag }}"
          git push
