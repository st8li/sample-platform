# Developers only need to touch this file. The platform owns the templates.
team: platform-demo
replicas: 2

image:
  repository: ghcr.io/st8li/hello
  tag: "0.1.2"

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

ingress:
  enabled: true
  host: hello.localtest.me   # *.localtest.me resolves to 127.0.0.1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70
