# The single entry point: Argo CD reads gitops/platform and gitops/apps
# and creates every Application it finds there ("app of apps").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/st8li/sample-platform.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      exclude: "bootstrap/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
