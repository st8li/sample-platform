# ':latest' makes deploys unreproducible and rollbacks impossible.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pinned-tag
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Pin an image tag; ':latest' or untagged images are not allowed."
        pattern:
          spec:
            containers:
              - image: "*:* & !*:latest"
