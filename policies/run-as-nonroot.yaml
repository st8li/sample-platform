# Starts in Audit mode: report violations without blocking, then flip to Enforce.
# This is how you roll out a new guardrail without breaking teams.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-nonroot
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - securityContext:
                  runAsNonRoot: true
